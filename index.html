<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockchain Breathing</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<canvas id="art"></canvas>

<div class="overlay top-left">
  <h1 class="title">Blockchain Breathing</h1>
  <p class="subtitle">l'art généré par le pouls d'Ethereum</p>
</div>

<div class="overlay top-right">
  <a class="btn" href="gallery.html">Galerie</a>
</div>

<div class="overlay bottom-left" id="stats">
  <div class="stat"><span class="label">epoch</span><span id="epochId">·</span></div>
  <div class="stat"><span class="label">slot</span><span id="slotIndex">· / 32</span></div>
  <div class="stat"><span class="label">eth</span><span id="price">·</span></div>
  <div class="stat"><span class="label">tx / bloc</span><span id="txCount">·</span></div>
</div>

<div class="overlay bottom-right">
  <div class="stat"><span class="label">prochain slot</span><span id="countdown">·</span></div>
  <div class="status" id="status">connexion au réseau…</div>
</div>

<div class="freeze" id="freeze">
  <p class="freeze-title">epoch achevée</p>
  <p class="freeze-sub">une photographie du réseau à cet instant</p>
</div>

<script src="assets/core.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
